name: Build and release Nomo

on:
  push:
    branches: [master, gpui-editor]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
          - name: macOS arm64
            runner: macos-14
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - name: Linux x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-xkb-dev libxcb-randr0-dev \
            libxcb-xinput-dev libxcb-cursor-dev libvulkan-dev libegl1-mesa-dev \
            libasound2-dev libudev-dev fonts-noto-cjk xdg-desktop-portal \
            dpkg-dev rpm desktop-file-utils jq
      - name: Initialize Windows SDK and MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
      - name: Check macOS toolchain
        if: runner.os == 'macOS'
        run: |
          xcrun --find metal
          xcrun --find metallib
          command -v jq
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check both native entrypoints
        run: |
          cargo check --locked --target ${{ matrix.target }} --bin nomo
          cargo check --locked --target ${{ matrix.target }} --features nomo-mark-demo --all-targets
      - name: Existing default editor tests
        run: cargo test --locked --release --target ${{ matrix.target }} --bin nomo
      - name: Existing document and NomoMark tests
        run: cargo test --locked --release --target ${{ matrix.target }} --features nomo-mark-demo --bin nomo
      - name: Build developer entrypoint
        run: cargo build --locked --release --target ${{ matrix.target }} --features nomo-mark-demo --bin nomo
      - name: Verify native dependencies
        shell: bash
        run: |
          cargo tree --locked --target ${{ matrix.target }} --all-features --prefix none > dependency-tree.txt
          if grep -E '^(tauri(-[^ ]*)?|wry|webview2-com|objc2-web-kit) v' dependency-tree.txt; then
            echo 'Unexpected WebView dependency' >&2
            exit 1
          fi
      - name: Package Windows (rebuild default features)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Package macOS (rebuild default features)
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh
      - name: Package Linux (rebuild default features)
        if: runner.os == 'Linux'
        run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: .artifacts/packages/*
          include-hidden-files: true
          if-no-files-found: error

  publish:
    name: Publish complete release
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-x64'
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release-assets
      - name: Validate version, complete asset set and archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/verify-release.py release-assets --tag "$RELEASE_TAG"
      - name: Publish assets atomically from a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes=".github/release-notes/$RELEASE_TAG.md"
          test -f "$notes" || { echo "Missing release notes: $notes" >&2; exit 1; }
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            test "$(jq -r '.isDraft' existing-release.json)" = true || { echo 'Refusing to replace a published release' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Nomo $RELEASE_TAG" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          printf '%s\n' release-assets/* | sed 's|^release-assets/||' | sort > expected-assets.txt
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > uploaded-assets.txt
          diff -u expected-assets.txt uploaded-assets.txt
          prerelease=false
          [[ "$RELEASE_TAG" != *-* ]] || prerelease=true
          gh release edit "$RELEASE_TAG" --draft=false --notes-file "$notes" --prerelease="$prerelease" --latest="$([[ "$prerelease" = false ]] && echo true || echo false)"

  update-homebrew-cask:
    name: Update Homebrew cask
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    permissions:
      contents: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Bump Casks/nomo.rb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          asset="Nomo_${version}_aarch64.dmg"
          gh release download "$TAG" --pattern "$asset" --dir /tmp
          sha256="$(sha256sum "/tmp/$asset" | awk '{print $1}')"
          sed -i -E \
            -e "s/version \"[^\"]+\"/version \"${version}\"/" \
            -e "s/sha256 \"[^\"]+\"/sha256 \"${sha256}\"/" \
            Casks/nomo.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/nomo.rb
          if git diff --staged --quiet; then
            echo 'Homebrew cask already up to date.'
            exit 0
          fi
          git commit -m "chore(homebrew): bump nomo cask to ${version}"
          git push

  sync-pages:
    name: Sync release to download sites
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    timeout-minutes: 30

    steps:
      - name: Trigger Pages deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOOK_URL" || {
            echo 'Missing CLOUDFLARE_PAGES_DEPLOY_HOOK repository secret.' >&2
            exit 1
          }
          curl --fail --show-error --silent --request POST "$DEPLOY_HOOK_URL" >/dev/null

      - name: Trigger GitHub Pages deployment
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_ACTIONS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || {
            echo 'Missing WEBSITE_ACTIONS_TOKEN repository secret.' >&2
            exit 1
          }
          gh api \
            --method POST \
            repos/nomo-md/nomo-md.github.io/actions/workflows/deploy-github-pages.yml/dispatches \
            --field ref=master

      - name: Verify latest stable download mirror
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          EXPECTED_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          base_urls=(
            'https://nomo-md.pages.dev'
            'https://nomo-md.github.io'
          )
          declare -A manifests=()

          for attempt in $(seq 1 150); do
            all_ready=true
            for base_url in "${base_urls[@]}"; do
              if [[ -n "${manifests[$base_url]:-}" ]]; then
                continue
              fi

              if manifest="$(curl --fail --silent --show-error \
                "$base_url/downloads/latest.json?expected=$EXPECTED_TAG&attempt=$attempt")"; then
                actual_tag="$(jq -r '.tag // empty' <<<"$manifest")"
                asset_count="$(jq -r '.assets | length' <<<"$manifest")"
                if [[ "$actual_tag" == "$EXPECTED_TAG" && "$asset_count" == '6' ]]; then
                  manifests[$base_url]="$manifest"
                  continue
                fi
              fi

              all_ready=false
            done

            if [[ "$all_ready" == 'true' && "${#manifests[@]}" == "${#base_urls[@]}" ]]; then
              break
            fi
            sleep 10
          done

          [[ "${#manifests[@]}" == "${#base_urls[@]}" ]] || {
            echo "The download sites did not publish $EXPECTED_TAG within 25 minutes." >&2
            exit 1
          }

          for base_url in "${base_urls[@]}"; do
            mapfile -t asset_urls < <(jq -r '.assets[].url' <<<"${manifests[$base_url]}")
            [[ "${#asset_urls[@]}" == '6' ]]
            for asset_url in "${asset_urls[@]}"; do
              curl --fail --silent --show-error --location --head "$base_url$asset_url" >/dev/null
            done
          done
