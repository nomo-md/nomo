[workspace]
members = ["src-gpui"]
exclude = ["vendor/latex-rust"]
resolver = "3"

[patch.crates-io]
# 固定 3.0.3 的本地扩展：宿主字形回退及数学语法兼容，仍沿用原 TeX 排版。
latex-rust = { path = "vendor/latex-rust" }

[workspace.package]
version = "0.7.5"

[profile.release]
debug = 1
# 保留 macOS 链接器所需的符号表对齐，不使用默认 debuginfo stripping。
strip = "none"
