[package]
name = "nomo-structure-index-evaluation"
version = "0.1.0"
edition = "2021"
publish = false

# 独立实验：未选型前不改变应用依赖，不进入桌面运行路径。
[workspace]

[dependencies]
pulldown-cmark = { version = "=0.13.5", default-features = false, features = ["html"] }
markdown-it = { version = "=0.6.1", default-features = false, features = ["linkify"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
html-escape = "=0.2.15"
regex = "1"
