[package]
name = "nomo"
version = "0.5.2"
description = "A lightweight Markdown-first editor"
authors = ["清羽"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "nomo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
encoding_rs = "0.8"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
sys-locale = "0.3"
md5 = "0.7"
lopdf = { version = "0.44", default-features = false }
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.38.2"
windows-core = "0.61"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSApplication",
  "NSImage",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSView",
  "NSWindow",
  "objc2-core-foundation",
  "std",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSData",
  "NSDictionary",
  "NSError",
  "NSGeometry",
  "NSObject",
  "NSString",
  "NSUserDefaults",
  "NSURL",
  "objc2-core-foundation",
  "std",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
  "WKContentWorld",
  "WKFrameInfo",
  "WKWebView",
  "block2",
  "std",
] }

# macOS 26/27 的 dyld 要求 LINKEDIT 字符串池 8 字节对齐，
# 而 Rust 1.77+ release 默认 strip = "debuginfo" 会把 proc-macro dylib 剥离成未对齐的坏文件，
# 导致编译期 E0463 "can't find crate"（rust-lang/rust#157750）。
# 在上游修复前，release 构建必须关闭 strip。
[profile.release]
strip = "none"
