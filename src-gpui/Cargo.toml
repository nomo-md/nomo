[package]
name = "nomo-gpui"
version.workspace = true
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Nomo native Markdown editor"

[[bin]]
name = "nomo"
path = "src/main.rs"

[features]
# 文档会话是正式编辑器的基础；feature 仅保留 NomoMark 开发外壳。
nomo-mark-demo = []
# 兼容更名前的构建命令。
editor-control-demo = ["nomo-mark-demo"]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10", default-features = false }
# 保持既有 Markdown 解析版本和语义。
pulldown-cmark = { version = "=0.13.5", default-features = false }
unicode-segmentation = "1.13"
unicode-normalization = "=0.1.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "=2.5.8"
# gpui 已经传递依赖 image 0.25，这里直接使用同一版本解码本地图片。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# 公式：纯 Rust 的 TeX 数学排版（STIX Two Math），输出字形已转为路径的 SVG。
latex-rust = "=3.0.1"
# Mermaid：纯 Rust 的解析、布局与 SVG 渲染（对齐 Mermaid 12.1.0，Zed 同款后端）。
merman = { version = "=0.9.2", features = ["native-fonts"] }
# 与 gpui 传递依赖的版本一致，用于把 SVG 栅格化为位图。
resvg = "=0.46.0"
encoding_rs = { version = "0.8" }
sha2 = { version = "0.10" }
# 与已有传递依赖共用系统语言探测，避免逐平台维护语言判断。
sys-locale = "=0.3.2"
regex = { version = "1" }
rusqlite = { version = "=0.40.2", features = ["bundled", "fallible_uint", "hooks"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "time"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
unicode-properties = { version = "0.1" }
html-escape = "=0.2.15"
web_atoms = { version = "0.2" }

[target.'cfg(not(windows))'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", default-features = false, features = ["font-kit", "wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "=3.6.1", default-features = false }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
ashpd = { version = "=0.11.1", default-features = false, features = ["async-std"] }

[target.'cfg(windows)'.dependencies]
# platform 0.3.10 在 Windows 强制嵌入自己的 manifest；直接构造后端以保留 Nomo 的 DPI/版本资源。
gpui_windows = { package = "gpui-pre-windows", version = "=0.3.10", default-features = false }
raw-window-handle = "=0.6.2"
# 复用 GPUI 已使用的 Windows 绑定，通过 Shell 切换任务栏按钮，避免隐藏/重建窗口造成闪烁。
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
# 复用依赖图中已有的资源编译器，嵌入 Nomo 图标、版本和 DPI manifest。
embed-resource = "=3.0.12"
