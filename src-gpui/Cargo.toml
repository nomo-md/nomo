[package]
name = "nomo-gpui"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Nomo Markdown 编辑器的 GPUI 原生原型"

# 独立 workspace：与 src-tauri 并存，不参与其构建，也不改动其锁文件。
[workspace]

[dependencies]
gpui = "=0.2.2"
# 与 src-tauri 锁定的版本一致，保证两端解析结果可对照。
pulldown-cmark = { version = "=0.13.5", default-features = false }
unicode-segmentation = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# gpui 已经传递依赖 image 0.25，这里直接使用同一版本解码本地图片。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# 公式：纯 Rust 的 TeX 数学排版（STIX Two Math），输出字形已转为路径的 SVG。
latex-rust = "=3.0.1"
# Mermaid：纯 Rust 的解析、布局与 SVG 渲染（对齐 Mermaid 12.1.0，Zed 同款后端）。
merman = { version = "=0.9.2", features = ["native-fonts"] }
# 与 gpui 传递依赖的版本一致，用于把 SVG 栅格化为位图。
resvg = "=0.45.1"

[profile.release]
debug = 1
